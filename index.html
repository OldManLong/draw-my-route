<style>
/* Layout: full-bleed map; search floats on top; one bottom sheet holds the current step (draw → links). */
:root{
  --bg:#eef1f4; --panel:#ffffffef; --fg:#141a21; --muted:#5d6977; --line:#dbe1e7; --chip:#edf0f4;
  --accent:#1f6fe0; --drawn:#e2560e; --good:#1d8a50; --warn:#b5530b; --danger:#c62828; --fake:#5b3fd1; --dark:#1d232b;
  --goodbg:#e5f5ec; --warnbg:#fff2e5;
  --shadow:0 6px 24px rgba(15,25,40,.16);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --sheet-h:300px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161b; --panel:#1b2129f0; --fg:#eef2f6; --muted:#9aa6b2; --line:#2d3641; --chip:#28303a;
  --accent:#4a90ff; --drawn:#ff7a3d; --good:#3fca83; --warn:#ffa25c; --danger:#ef4444; --fake:#9b87ff; --dark:#e9edf2;
  --goodbg:#163325; --warnbg:#3a2614; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --panel:#1b2129f0; --fg:#eef2f6; --muted:#9aa6b2; --line:#2d3641; --chip:#28303a;
  --accent:#4a90ff; --drawn:#ff7a3d; --good:#3fca83; --warn:#ffa25c; --danger:#ef4444; --fake:#9b87ff; --dark:#e9edf2;
  --goodbg:#163325; --warnbg:#3a2614; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--ui);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.55)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.55)}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom{bottom:calc(var(--sheet-h) + 4px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);border-radius:14px}

#top{position:fixed;z-index:500;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#top>*{pointer-events:auto;max-width:460px}
#searchbox{display:flex;align-items:center;gap:8px;padding:10px 12px}
#searchbox input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;outline:none}
#ends{padding:2px 12px}
.endrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.endrow+.endrow{border-top:1px solid var(--line)}
.endrow input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;outline:none;padding:4px 0}
.endrow input::-webkit-search-cancel-button{display:none}
.dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 11px/1 var(--ui)}
.dot.a{background:var(--good)}.dot.b{background:var(--danger)}
#b-loc{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:17px;line-height:1}
.note{margin:0;padding:10px 12px;border-left:4px solid var(--drawn);background:var(--chip);border-radius:8px;font-size:16px}
#map{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#results{margin-top:6px;max-height:40vh;overflow:auto}
#results button{display:block;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
#results button:first-child{border-top:0}
#results small{display:block;color:var(--muted)}

#sheet{position:fixed;z-index:500;left:0;right:0;bottom:0;margin:0 auto;max-width:540px;max-height:62vh;overflow:auto;
  padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:10px}
#sheet.compact{max-height:46vh}
#sheet a:not(.btn){color:var(--accent)}
#sheet h2{margin:0;font-size:20px;line-height:1.2;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;padding:12px 14px;border-radius:12px;background:var(--chip);font-weight:600;text-align:center;text-decoration:none;color:var(--fg);min-width:0}
.btn.small{flex:0 0 auto;padding:8px 12px;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.google{background:var(--accent);color:#fff}
.btn.apple{background:var(--dark);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.tools{margin-top:-2px}
.stats{display:flex;gap:20px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:19px}
.stats span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.opts summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;padding:2px 0}
.toggle{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:8px}
.toggle input{margin-top:3px}
.match{padding:10px 12px;border-radius:12px;font-size:14px}
.match b{font-size:17px;font-variant-numeric:tabular-nums}
.match.good{background:var(--goodbg);color:var(--good)}
.match.warn{background:var(--warnbg);color:var(--warn)}
.part{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:14px}
.ptitle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-size:14px}
#toast{position:fixed;z-index:600;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 122px);padding:10px 16px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;max-width:88vw;text-align:center;box-shadow:var(--shadow)}

.pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px/1 var(--ui);border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.pin.start{background:var(--good)}.pin.end{background:var(--danger)}.pin.mid{background:var(--drawn)}
.pin.fake{background:var(--fake);width:12px;height:12px;margin:7px;border-width:2px}
.pin.split{background:var(--dark);color:var(--bg)}
.pin.avoid{background:var(--danger);width:22px;height:22px;font-size:12px;margin:2px}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--chip);gap:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:4px solid var(--drawn);vertical-align:middle;margin-right:5px;border-radius:2px}
.legend i.pred{border-top:3px dashed var(--accent)}
.legend i.dot{width:10px;height:10px;border:0;border-radius:50%;background:var(--fake)}
.legend i.x{width:10px;height:10px;border:0;border-radius:50%;background:var(--danger)}
.pop{display:flex;flex-direction:column;gap:8px;min-width:150px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>
<div id="top">
  <div id="ends" class="glass">
    <div class="endrow"><span class="dot a" aria-hidden="true">A</span><input id="q-from" type="search" placeholder="Starting from…" autocomplete="off" enterkeyhint="search" aria-label="Starting from"><button id="b-loc" type="button" aria-label="Use my current location" title="Use my current location">◎</button></div>
    <div class="endrow"><span class="dot b" aria-hidden="true">B</span><input id="q-to" type="search" placeholder="Going to…" autocomplete="off" enterkeyhint="search" aria-label="Going to"></div>
  </div>
  <div id="results" class="glass" hidden></div>
</div>
<div id="sheet" class="glass"></div>
<div id="toast" hidden></div>

<script src="leaflet.js?v=5a640ff863"></script>
<script src="roads.js?v=7fd4381bce"></script>
<script src="app.js?v=c1bb706ae0"></script>
</body>
</html>
